<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gallant lab in context — themes across the field</title>
<style>
 *{box-sizing:border-box;} body{margin:0;font-family:Helvetica,Arial,sans-serif;color:#222;
   display:flex;flex-direction:column;height:100vh;}
 header{padding:8px 16px;} .sub{color:#666;font-size:12.5px;}
 main{flex:1;display:flex;min-height:0;}
 #figwrap{flex:1;min-width:0;overflow:auto;padding:6px 10px;}
 #fig{width:100%;height:auto;display:block;}
 .node{cursor:pointer;} .node.bg circle:not(.hit){opacity:.38;}
 .node.bg:hover circle:not(.hit),.node.bg:focus circle:not(.hit){r:6;opacity:1;}
 .node.spine:hover circle:not(.hit),.node.spine:focus circle:not(.hit){r:11;}
 .node:hover .lbl{fill:#000;} .node.sel circle:not(.hit){stroke:#000;stroke-width:2.6px;opacity:1;}
 .dim{opacity:.1;transition:opacity .15s;}
 aside{width:340px;border-left:1px solid #e5e5e5;padding:16px 18px;overflow:auto;font-size:13.5px;line-height:1.45;}
 #fam{display:inline-block;padding:2px 9px;border-radius:11px;color:#fff;font-size:12px;font-weight:bold;}
 #apa{margin:12px 0;} .meta{color:#666;font-size:12.5px;}
 #summary{margin:10px 0;color:#333;font-size:12.5px;line-height:1.5;}
 a.doi{display:inline-block;margin-top:12px;padding:7px 13px;background:#1b6ca8;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;}
 a.doi.off{background:#bbb;pointer-events:none;} .hint{color:#999;}
 #close{float:right;border:none;background:#eee;border-radius:50%;width:24px;height:24px;font-size:16px;cursor:pointer;color:#444;}
 a.dl{float:right;margin-left:12px;padding:5px 11px;background:#217346;color:#fff;border-radius:6px;text-decoration:none;font-size:12.5px;}
 #nav{margin:10px 0 0;padding-bottom:10px;border-bottom:1px solid #e3e3e3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:32px;}
 #nav a.doi{margin:0;}
 #nav button{padding:6px 12px;font-size:12.5px;border:1px solid #bbb;border-radius:6px;background:#fafafa;cursor:pointer;}
 #nav button:hover{background:#eee;} #nav button:disabled{opacity:.4;cursor:default;}
 #pos{font-size:11.5px;color:#777;margin-left:auto;}
 #scope{font-size:11.5px;color:#555;margin:8px 0 12px;}
 #scope label{cursor:pointer;}
 .lanelabel{cursor:help;} .lanelabel:focus{outline:2px solid #1b6ca8;outline-offset:2px;}
 #famtip{position:fixed;z-index:20;width:330px;max-width:46vw;/*JS sets the real width*/background:#fff;color:#222;
   border:1px solid #d5d5d5;border-left-width:4px;border-radius:6px;padding:12px 14px;
   box-shadow:0 8px 28px rgba(0,0,0,.17);font-size:12.5px;line-height:1.45;pointer-events:none;}
 #famtip[hidden]{display:none;}
 #famtip .ft-name{font-weight:bold;font-size:14px;margin-bottom:1px;}
 #famtip .ft-n{color:#888;font-size:11px;margin-bottom:8px;}
 #famtip .ft-claim{color:#333;}
 #famtip .ft-lab{margin-top:10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#999;}
 #famtip .ft-lin{color:#444;font-size:12px;margin-top:2px;}
 @media (max-width:720px){
  body{height:auto;min-height:100vh;}
  main{flex-direction:column;}
  #figwrap{flex:none;overflow:visible;padding:6px;}
  aside{width:auto;border-left:none;border-top:1px solid #e5e5e5;}
  .sub{margin-top:6px;}
  header .dl{float:none;display:inline-block;margin:8px 0 0;}
 }
</style></head><body>

topic": "2020s", "source": "lab", "summary": "Speech processing requires extracting meaning from acoustic patterns using a set of intermediate representations based on a dynamic segmentation of the speech stream. Using whole brain mapping obtained in fMRI, we investigate the locus of cortical phonemic processing not only for single phonemes but also for short combinations made of diphones and triphones. We find that phonemic processing areas are much larger than previously described: they include not only the classical areas in the dorsal superior temporal gyrus but also a larger region in the lateral temporal cortex where diphone feature", "oa": 18, "s2": 26, "ny": 465.0}, "L134": {"ref": "L134", "family": "Encoding-model methods, software, and frameworks", "year": 2023, "apa": "Meschke, E. X., Castello, M. V. D. O., Tour, T. D. L., & Gallant, J. L. (2023). Model connectivity: Leveraging the power of encoding models to overcome the limitations of functional connectivity. bioRxiv.", "doi": "https://doi.org/10.1101/2023.07.17.549356", "topic": "2020s", "source": "lab", "summary": "Model connectivity: Leveraging the power of encoding models to overcome the limitations of functional connectivity", "oa": 8, "s2": 9, "ny": 865.5}, "L139": {"ref": "L139", "family": "Language and conceptual semantic representation", "year": 2024, "apa": "Chen, C., Dupr\u00e9 la Tour, T., Gallant, J. L., Klein, D., & Deniz, F. (2024). The cortical representation of language timescales is shared between reading and listening. Communications Biology, 7(1).", "doi": "https://doi.org/10.1038/s42003-024-05909-z", "topic": "2020s", "source": "lab", "summary": "Language comprehension involves integrating low-level sensory inputs into a hierarchy of increasingly high-level features. Prior work studied brain representations of different levels of the language hierarchy, but has not determined whether these brain representations are shared between written and spoken language. To address this issue, w  "Active naturalistic behavior, navigation, and cognitive state", "year": 2025, "apa": "Zhang, T., Meschke, E. X., & Gallant, J. (2025). A map of the cortical functional network mediating naturalistic navigation. bioRxiv.", "doi": "https://doi.org/10.64898/2025.12.16.694742", "topic": "2020s", "source": "lab", "summary": "Navigation through the real world requires close coordination of perception, planning, and motor actions. Prior neuroimaging studies that used controlled stimuli and tasks have suggested that navigation-related information is represented broadly across the human cerebral cortex. While three regions in the anterior visual cortex have been well-studied1, the extent and functional properties of regions in the parietal and prefrontal cortices are not as well-characterized 2. To map and characterize the full cortical network that underpins active navigation in the real world, we used functional mag", "oa": 1, "s2": 2, "ny": 728.5}, "L147": {"ref": "L147", "family": "Language and conceptual semantic representation", "year": 2025, "apa": "Visconti di Oleggio Castello, M., Dupr\u00e9 la Tour, T., & Gallant, J. L. (2025). Individual differences shape conceptual representation in the brain. bioRxiv.", "doi": "https://doi.org/10.1101/2025.08.22.671848", "topic": "2020s", "source": "lab", "summary": "Each person experiences the world through a unique conceptual lens, shaped by personal experiences, natural variations, or disease. These individual differences have remained largely inaccessible to cognitive neuroscience and clinical neurology, limiting the development of precision medicine approaches to cognitive disorders. To overcome this limitation, here we develop a new statistical framework to measure and interpret individual differences in functional brain representations. We apply this framework to characterize how different individuals represent the same concepts. Twenty-four partici", "oa": 2, "s2": 2, "ny": 454.5}, "L151": {"ref": "L151", "family": "En  hours of natural narratives i", "oa": 2, "s2": null, "ny": 454.5}, "L154": {"ref": "L154", "family": "Language and conceptual semantic representation", "year": 2026, "apa": "Chen, C., Gong, X. L., Deniz, F., Klein, D. L., & Gallant, J. L. (2026). Representations of semantic relations in the human cerebral cortex. bioRxiv.", "doi": "https://doi.org/10.64898/2026.02.19.706815", "topic": "2020s", "source": "lab", "summary": "Abstract An essential aspect of human cognition is the ability to explicitly think about semantic relations between concepts. Neuroimaging studies have found that individual concepts are encoded by distributed patterns of cortical activity, but relatively little is known about how semantic relations between concepts are encoded in the brain. Some theoretical models suggest that relation representations are embedded within concept representations, while others suggest that relation representations are independent of any specific concept pair. We designed a study to compare how semantic relation", "oa": 0, "s2": 0, "ny": 465.0}, "L155": {"ref": "L155", "family": "Attention and task-driven warping of representations", "year": 2026, "apa": "Zhang, T., & Gallant, J. L. (2026). Visual semantic tuning across the cortex shifts between tasks. bioRxiv.", "doi": "https://doi.org/10.64898/2026.02.19.706797", "topic": "2020s", "source": "lab", "summary": "Abstract Attention is a powerful mechanism that dynamically optimizes brain representations to prioritize behaviorally-relevant information. While previous studies focusing on single tasks have demonstrated that attention shifts tuning towards attended targets, real-world behavior often requires humans to switch between tasks with different demands. How does visual semantic tuning in the human brain shift to support the behavioral demands of different naturalistic tasks? To answer this question, we used voxelwise encoding models to compare visual semantic tuning across the human cerebral corte", "oa": 0, "s2": 0, "ny": 591.5}}, FAMCOLOR={"Low/intermediate visual encoding and stimulus reconstruction": "#1b6ca8", "Semantic and scene-category maps of visual cortex": "#2a9d8f", "Language and conceptual semantic representation": "#e76f51", "Attention and task-driven warping of representations": "#8338ec", "Active naturalistic behavior, navigation, and cognitive state": "#d4a017", "Encoding-model methods, software, and frameworks": "#6c757d"}, FAMINFO={"Low/intermediate visual encoding and stimulus reconstruction": {"key": "visual_encoding_decoding", "claim": "Voxelwise receptive-field models of early-to-intermediate visual cortex that predict BOLD from images/movies and let perceived stimuli be identified or reconstructed.", "lineage": "Hubel 1962 -> Hubel 1968 -> Adelson 1985 -> Olshausen 1996 -> Olshausen 1997 -> Haxby 2001", "n": 82}, "Semantic and scene-category maps of visual cortex": {"key": "semantic_scene_maps", "claim": "Cortex-wide voxelwise models reveal continuous semantic spaces for objects, actions, and natural-scene categories tiling occipito-temporal and higher visual cortex.", "lineage": "Malach 1995 -> Kanwisher 1997 -> Epstein 1998 -> Downing 2001 -> Quiroga 2005 -> Kriegeskorte 2008", "n": 53}, "Language and conceptual semantic representation": {"key": "language_semantics", "claim": "Voxelwise modeling of narrative speech and reading maps semantic, phonemic, and timescale structure of language and its amodal/conceptual organization across cortex.", "lineage": "Mitchell 2008 -> Binder 2009 -> Lerner 2011 -> Price 2012 -> Mesgarani 2014 -> Huth 2016", "n": 60}, "Attention and task-driven warping of representations": {"key": "attention_task_warping", "claim": "Selective attention and naturalistic task demands shift and warp semantic and spatial tuning across visual and association cortex toward behaviorally relevant targets.", "lineage": "Desimone 1995 -> Treue 1999 -> McAdams 1999 -> Reynolds 2004 -> Reynolds 2009 -> Cohen 2009", "n": 47}, "Active naturalistic behavior, navigation, and cognitive state": {"key": "naturalistic_behavior_navigation", "claim": "fMRI during active tasks such as virtual navigation and driving recovers distributed cortical representations of navigation, control, and task-related cognitive states.", "lineage": "Epstein 1999 -> Maguire 2000 -> Doeller 2010 -> Constantinescu 2016 -> Epstein 2017 -> Boto 2018", "n": 41}, "Encoding-model methods, software, and frameworks": {"key": "modeling_methods_software", "claim": "Statistical methods, experimental-design tools, and open-source software that operationalize the voxelwise encoding/decoding framework for human fMRI.", "lineage": "Ogawa 1990 -> Friston 1994 -> Logothetis 2001 -> Fischl 2012 -> Glasser 2013 -> Esteban 2019", "n": 76}},
 panel=document.getElementById('panel'), famtip=document.getElementById('famtip');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>(
 {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function resetPanel(){document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));
 panel.innerHTML='<div class="hint">Click any node to see its full reference here, '
  +'then step through the timeline with Next/Prev or the arrow keys.</div>';CUR=null;}
function show(k){const d=DATA[k];if(!d)return;
 document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));
 const g=document.querySelector('.node[data-key="'+CSS.escape(k)+'"]');if(g)g.classList.add('sel');
 const url=(d.doi||'').startsWith('http')?d.doi:'';
 const doi=url?'<a class="doi" href="'+esc(url)+'" target="_blank" rel="noopener">Open paper \u2197</a>':'<a class="doi off">no DOI</a>';
 const c=[];if(Number.isInteger(d.oa))c.push(d.oa+' (OpenAlex)');if(Number.isInteger(d.s2))c.push(d.s2+' (S2)');
 panel.innerHTML='<button id="close" onclick="resetPanel()">\u00d7</button>'
  +'<div id="fam" style="background:'+esc(FAMCOLOR[d.family]||'#666')+'">'+esc(d.family)+'</div> <span class="meta">'+esc(d.ref)+' \u00b7 '+esc(d.topic)+'</span>'
  +navHTML(k,doi)
  +'<div id="apa">'+esc(d.apa)+'</div>'+(d.summary?'<div id="summary">'+esc(d.summary)+'</div>':'')+(c.length?'<div class="meta">Cited by: '+esc(c.join(' \u00b7 '))+'</div>':'');
 CUR=k; wireNav();}

// ---- walking the timeline -------------------------------------------------
// ORDER is every paper sorted by year; WITHIN is the same restricted to one
// family lane. The figure has hundreds of small dots, so clicking each one is
// impractical; Next/Prev (and the arrow keys) step through them in time order.
//
// The tie-break inside a year is `ny`, the dot's own drawn y. Every paper of a
// given year shares one x, so a year IS a vertical column; ordering the walk by
// ny sweeps that column top to bottom. Sorting on the reference string instead
// (what this did until 2026-09-19) bore no relation to the beeswarm, which fans
// dots out from the lane center as 0, +d, -d, +2d, -2d - so Next jumped the
// highlight up and down the column and the walk read as random.
let CUR=null, LANEONLY=true;
const ORDER=Object.keys(DATA).sort((a,b)=>DATA[a].year-DATA[b].year
 ||DATA[a].ny-DATA[b].ny||a.localeCompare(b));
function seq(){return LANEONLY&&CUR?ORDER.filter(r=>DATA[r].family===DATA[CUR].family):ORDER;}
function navHTML(k,doi){const q=LANEONLY?ORDER.filter(r=>DATA[r].family===DATA[k].family):ORDER;
 const i=q.indexOf(k);
 return '<div id="nav"><button id="prev"'+(i<=0?' disabled':'')+'>\u2190 Prev</button>'
  +'<button id="next"'+(i<0||i>=q.length-1?' disabled':'')+'>Next \u2192</button>'
  +(doi||'')+'<span id="pos">'+(i+1)+' / '+q.length+'</span></div>'
  +'<div id="scope"><label><input type="checkbox" id="lanechk"'+(LANEONLY?' checked':'')+'> '
  +'stay in this family ('+esc(DATA[k].family)+')</label></div>';}
function step(n){const q=seq();const i=q.indexOf(CUR);const j=i+n;
 if(j<0||j>=q.length)return;show(q[j]);
 const g=document.querySelector('.node[data-key="'+CSS.escape(q[j])+'"]');
 if(g&&g.scrollIntoView)g.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
function wireNav(){const p=document.getElementById('prev'),n=document.getElementById('next'),
  c=document.getElementById('lanechk');
 if(p)p.onclick=()=>step(-1); if(n)n.onclick=()=>step(1);
 if(c)c.onchange=()=>{LANEONLY=c.checked;show(CUR);};}
document.addEventListener('keydown',e=>{if(!CUR)return;
 if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
 if(e.key==='ArrowRight'){e.preventDefault();step(1);}
 else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}});
document.querySelectorAll('.node').forEach(g=>{g.addEventListener('click',()=>show(g.dataset.key));
 g.addEventListener('focus',()=>show(g.dataset.key));
 g.addEventListener('keydown',e=>{if(e.key==='Enter')show(g.dataset.key);});});
function showFam(f,el){const d=FAMINFO[f];if(!d)return;const c=FAMCOLOR[f]||'#222';
 famtip.innerHTML='<div class="ft-name" style="color:'+esc(c)+'">'+esc(f)+'</div>'
  +'<div class="ft-n">'+d.n+' paper'+(d.n===1?'':'s')+' in this family</div>'
  +(d.claim?'<div class="ft-claim">'+esc(d.claim)+'</div>':'')
  +(d.lineage?'<div class="ft-lab">Lineage</div><div class="ft-lin">'+esc(d.lineage)+'</div>':'');
 famtip.style.borderLeftColor=c;famtip.hidden=false;
 // Sit ON the lane legend, at the left edge. Anchored to the label's RIGHT edge
 // the panel landed over the start of the plot and hid the earliest papers —
 // which on a density-warped axis is exactly where the foundations sit. Size it
 // to the legend band so it covers the thing it describes, with a readable floor
 // and a viewport cap for narrow windows.
 const r=el.getBoundingClientRect();
 const INSET=6;                      // small gutter so it reads as a panel, not a block
 const band=Math.max(0,r.right-r.left);
 const w=Math.min(Math.max(band-2*INSET,240),Math.round(window.innerWidth*0.46));
 famtip.style.width=w+'px';
 const h=famtip.offsetHeight;        // measured AFTER the width is applied
 famtip.style.left=Math.max(4,Math.min(r.left+INSET,window.innerWidth-w-8))+'px';
 famtip.style.top=Math.max(8,Math.min(r.top,window.innerHeight-h-8))+'px';}
function hideFam(){famtip.hidden=true;}
document.querySelectorAll('.lanelabel').forEach(g=>{const f=g.dataset.fam;
 const on=()=>{showFam(f,g);
  document.querySelectorAll('.node').forEach(n=>{if(DATA[n.dataset.key].family!==f)n.classList.add('dim');});};
 const off=()=>{hideFam();document.querySelectorAll('.node').forEach(n=>n.classList.remove('dim'));};
 g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
 g.addEventListener('mouseleave',off);g.addEventListener('blur',off);
 g.addEventListener('keydown',e=>{if(e.key==='Escape'){off();g.blur();}});});
</script></body></html>
